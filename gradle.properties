# Maven 发布（可由 -P / 环境变量覆盖）
GROUP_ID=io.github.sofarnobug
MAVEN_VERSION=1.0.0-2.31.0
MAVEN_REPO_URL=https://maven.pkg.github.com/SoFarNoBug/KuiklyHolm
MAVEN_USERNAME=
MAVEN_PASSWORD=
#Gradle（发行包见 gradle/wrapper → mirrors.cloud.tencent.com/gradle）
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
# Maven 仓库见 settings.gradle.kts / build.gradle.kts（腾讯云 maven-public，无 google/central 直连）
org.gradle.daemon=true
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# 本机仅有 platforms/android-37.0；禁止 AGP 去拉 Google SDK 清单（会卡 Still waiting for package manifests）
android.builder.sdkDownload=false
android.suppressUnsupportedCompileSdk=37,37.0
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
ksp.incremental=false
compose.ios.resources.sync=false