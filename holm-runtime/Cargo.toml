[package]
name = "holm_runtime"
version = "0.0.1"
edition = "2021"
description = "Holm Standard M0 spike · Rust + wgpu clear/triangle + Lite3 approx (DualTrack B)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "holm_runtime"

[features]
default = ["wgpu_backend"]
wgpu_backend = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
wgpu = { version = "23", default-features = false, features = ["wgsl", "webgpu", "webgl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "Window", "Document", "console"] }
