[package]
name = "holm_runtime"
version = "0.0.1"
edition = "2021"
description = "Holm Standard M0 spike · Rust + wgpu Session (H5 wasm + Android + iOS)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "holm_runtime"

[features]
default = ["wgpu_backend"]
wgpu_backend = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23", default-features = false, features = ["wgsl", "webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "Window", "Document", "console"] }

[target.'cfg(target_os = "android")'.dependencies]
# wgpu 23：Android 经 target cfg 拉 vulkan；勿写不存在的 feature `gles`
wgpu = { version = "23", default-features = false, features = ["wgsl"] }
jni = "0.21"
ndk-sys = "0.6"
raw-window-handle = "0.6"
pollster = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
# ADR 0009：Metal + C Session；勿静默换非 wgpu
wgpu = { version = "23", default-features = false, features = ["wgsl", "metal"] }
pollster = "0.4"

# ADR 0010：Ohos 报 target_os=linux + target_env=ohos；仅本 target 升 wgpu 30（VK_OHOS_surface）
[target.'cfg(target_env = "ohos")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl"] }
raw-window-handle = "0.6"
pollster = "0.4"
