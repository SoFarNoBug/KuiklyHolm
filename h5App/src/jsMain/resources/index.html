<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kuikly-Web-Render</title>
    <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">
</head>
<style>
    *{
      margin: 0;
      padding: 0;
    }
    body {
        overflow: hidden
    }
    /* 隐藏输入框边框的样式 */
    input:focus {
      outline: none;
    }
    /* toast提示框的样式 */
    .toast-wrapper {
        position: fixed;
        z-index: 100000;
        height: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 70px;
        background-color: white;
    }
    .toast-content {
        display: flex;
        font-size: 12px;
        line-height: 30px;
        min-width: 150px;
        border: 1px solid gray;
        border-radius: 5px;
        justify-content: center;
    }
    /* 隐藏滚动条的样式 */
    .list-no-scrollbar {
        scrollbar-width: none;
    }
    .list-no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    /* 转菊花的动画样式 */
    @keyframes activityIndicatorRotate {
        0% { transform: rotate(0deg) }
        100% { transform: rotate(360deg) }
    }
</style>
<body>
<div id="root"></div>
<script src="http://127.0.0.1:8083/nativevue2.js" type="text/javascript"></script>
<!-- ADR 0020 · kmp-draco（独立 __kmp_draco_bindgen，避免与 wgpu wasm_bindgen 冲突） -->
<script src="kmp-draco-native/kmp_draco_native.js" type="text/javascript"></script>
<script src="kmp-draco-native/kmp_draco_glue.js" type="text/javascript"></script>
<script type="text/javascript">
  (function () {
    // glue 已挂 window.__kmpDraco；ready 对齐 __kmpWgpu（ADR 0020 / review P1）
    if (window.__kmpDraco) {
      window.__kmpDraco.ready = false;
    }
    if (typeof __kmp_draco_bindgen !== 'function') {
      console.warn('kmp-draco: __kmp_draco_bindgen missing');
      if (window.__kmpDraco) window.__kmpDraco.error = 'bindgen missing';
      return;
    }
    __kmp_draco_bindgen('kmp-draco-native/kmp_draco_native_bg.wasm')
      .then(function () {
        if (window.__kmpDraco) window.__kmpDraco.ready = true;
      })
      .catch(function (e) {
        console.warn('kmp-draco wasm init failed', e);
        if (window.__kmpDraco) {
          window.__kmpDraco.ready = false;
          window.__kmpDraco.error = (e && e.message) ? e.message : String(e);
        }
      });
  })();
</script>
<!-- DualTrack B：kmp-wgpu-native wasm（no-modules）；失败时 __kmpWgpu.ready=false，Kotlin 侧 BLOCKED -->
<script src="kmp-wgpu-native/kmp_wgpu_native.js" type="text/javascript"></script>
<script type="text/javascript">
  (function () {
    window.__kmpWgpu = { ready: false };
    if (typeof wasm_bindgen !== 'function') {
      window.__kmpWgpu.error = 'wasm_bindgen missing (kmp_wgpu_native.js not loaded)';
      return;
    }
    // no-modules：init Promise resolve 的是 raw wasm exports；胶水 API 在 wasm_bindgen.* 上
    wasm_bindgen('kmp-wgpu-native/kmp_wgpu_native_bg.wasm')
      .then(function () {
        window.__kmpWgpu = {
          ready: true,
          abiVersion: function () { return wasm_bindgen.kmp_wgpu_abi_version(); },
          hasWgpu: function () { return wasm_bindgen.kmp_wgpu_has_wgpu(); },
          createSession: function (canvas) { return wasm_bindgen.KmpWgpuSession.create(canvas); },
          // ADR 0020 · ModelPass（与 Fullscreen Session 分型；仅 WebGPU）
          createModelSession: function (canvas) { return wasm_bindgen.KmpWgpuModelSession.create(canvas); },
          // ADR 0013 v1.1 · headless Compute（与 Surface Session 分型）
          createHeadless: function () { return wasm_bindgen.HeadlessComputeSession.create(); },
        };
      })
      .catch(function (e) {
        window.__kmpWgpu = {
          ready: false,
          error: (e && e.message) ? e.message : String(e),
        };
      });
  })();
</script>
<!-- libpag optional; CDN hangs block h5App and white-screen the page. Re-add when PAG is needed. -->
<script src="h5App.js" type="text/javascript"></script>
</body>
</html>
